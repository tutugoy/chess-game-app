<!DOCTYPE html>
<html lang="en" >
<head>
  <meta charset="UTF-8">
  <title>Srimaan's Chess Game engine</title>
  <link rel="stylesheet" href="./style.css">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
<div id="game-container">
  <div id="board-container">
    <div id="clock-top" class="chess-clock">
      <div class="clock-label">Black</div>
      <div class="clock-time" id="clock-black">10:00</div>
    </div>
    <div id="game">
      <div id="board-wrapper">
        <!-- Rank 8 -->
        <div class="cellprefix rank-8">8</div>
        <div class="gamecell" id="1_8"></div>
        <div class="gamecell grey" id="2_8"></div>
        <div class="gamecell" id="3_8"></div>
        <div class="gamecell grey" id="4_8"></div>
        <div class="gamecell" id="5_8"></div>
        <div class="gamecell grey" id="6_8"></div>
        <div class="gamecell" id="7_8"></div>
        <div class="gamecell grey" id="8_8"></div>
        
        <!-- Rank 7 -->
        <div class="cellprefix rank-7">7</div>
        <div class="gamecell grey" id="1_7"></div>
        <div class="gamecell" id="2_7"></div>
        <div class="gamecell grey" id="3_7"></div>
        <div class="gamecell" id="4_7"></div>
        <div class="gamecell grey" id="5_7"></div>
        <div class="gamecell" id="6_7"></div>
        <div class="gamecell grey" id="7_7"></div>
        <div class="gamecell" id="8_7"></div>
        
        <!-- Rank 6 -->
        <div class="cellprefix rank-6">6</div>
        <div class="gamecell" id="1_6"></div>
        <div class="gamecell grey" id="2_6"></div>
        <div class="gamecell" id="3_6"></div>
        <div class="gamecell grey" id="4_6"></div>
        <div class="gamecell" id="5_6"></div>
        <div class="gamecell grey" id="6_6"></div>
        <div class="gamecell" id="7_6"></div>
        <div class="gamecell grey" id="8_6"></div>
        
        <!-- Rank 5 -->
        <div class="cellprefix rank-5">5</div>
        <div class="gamecell grey" id="1_5"></div>
        <div class="gamecell" id="2_5"></div>
        <div class="gamecell grey" id="3_5"></div>
        <div class="gamecell" id="4_5"></div>
        <div class="gamecell grey" id="5_5"></div>
        <div class="gamecell" id="6_5"></div>
        <div class="gamecell grey" id="7_5"></div>
        <div class="gamecell" id="8_5"></div>
        
        <!-- Rank 4 -->
        <div class="cellprefix rank-4">4</div>
        <div class="gamecell" id="1_4"></div>
        <div class="gamecell grey" id="2_4"></div>
        <div class="gamecell" id="3_4"></div>
        <div class="gamecell grey" id="4_4"></div>
        <div class="gamecell" id="5_4"></div>
        <div class="gamecell grey" id="6_4"></div>
        <div class="gamecell" id="7_4"></div>
        <div class="gamecell grey" id="8_4"></div>
        
        <!-- Rank 3 -->
        <div class="cellprefix rank-3">3</div>
        <div class="gamecell grey" id="1_3"></div>
        <div class="gamecell" id="2_3"></div>
        <div class="gamecell grey" id="3_3"></div>
        <div class="gamecell" id="4_3"></div>
        <div class="gamecell grey" id="5_3"></div>
        <div class="gamecell" id="6_3"></div>
        <div class="gamecell grey" id="7_3"></div>
        <div class="gamecell" id="8_3"></div>
        
        <!-- Rank 2 -->
        <div class="cellprefix rank-2">2</div>
        <div class="gamecell" id="1_2"></div>
        <div class="gamecell grey" id="2_2"></div>
        <div class="gamecell" id="3_2"></div>
        <div class="gamecell grey" id="4_2"></div>
        <div class="gamecell" id="5_2"></div>
        <div class="gamecell grey" id="6_2"></div>
        <div class="gamecell" id="7_2"></div>
        <div class="gamecell grey" id="8_2"></div>
        
        <!-- Rank 1 -->
        <div class="cellprefix rank-1">1</div>
        <div class="gamecell grey" id="1_1"></div>
        <div class="gamecell" id="2_1"></div>
        <div class="gamecell grey" id="3_1"></div>
        <div class="gamecell" id="4_1"></div>
        <div class="gamecell grey" id="5_1"></div>
        <div class="gamecell" id="6_1"></div>
        <div class="gamecell grey" id="7_1"></div>
        <div class="gamecell" id="8_1"></div>
        
        <!-- File labels (a-h) at the bottom -->
        <div class="cellprefix file-empty"></div>
        <div class="cellprefix file-a">a</div>
        <div class="cellprefix file-b">b</div>
        <div class="cellprefix file-c">c</div>
        <div class="cellprefix file-d">d</div>
        <div class="cellprefix file-e">e</div>
        <div class="cellprefix file-f">f</div>
        <div class="cellprefix file-g">g</div>
        <div class="cellprefix file-h">h</div>
      </div>
      
      <!-- Promotion Dial -->
      <div id="promotion-dial" class="promotion-dial">
        <div class="promotion-dial__backdrop"></div>
        <div class="promotion-dial__ring">
          <div class="promotion-dial__center-hole"></div>
          <div class="promotion-dial__quadrants">
            <div class="promotion-dial__quadrant promotion-dial__quadrant--top-left" data-piece="queen">
              <div class="promotion-dial__quadrant-inner">
                <img class="promotion-dial__icon" src="" alt="Queen" data-white="" data-black="">
              </div>
            </div>
            <div class="promotion-dial__quadrant promotion-dial__quadrant--top-right" data-piece="rook">
              <div class="promotion-dial__quadrant-inner">
                <img class="promotion-dial__icon" src="" alt="Rook" data-white="" data-black="">
              </div>
            </div>
            <div class="promotion-dial__quadrant promotion-dial__quadrant--bottom-left" data-piece="bishop">
              <div class="promotion-dial__quadrant-inner">
                <img class="promotion-dial__icon" src="" alt="Bishop" data-white="" data-black="">
              </div>
            </div>
            <div class="promotion-dial__quadrant promotion-dial__quadrant--bottom-right" data-piece="knight">
              <div class="promotion-dial__quadrant-inner">
                <img class="promotion-dial__icon" src="" alt="Knight" data-white="" data-black="">
              </div>
            </div>
          </div>
        </div>
      </div>

      <div id="clock-bottom" class="chess-clock">
        <div class="clock-label">White</div>
        <div class="clock-time" id="clock-white">10:00</div>
      </div>
      <div id="game-controls">
        <button id='save-btn' class="gray" onclick="main.methods.saveGame()">Save Game</button>
        <button id='load-btn' class="gray" onclick="main.methods.loadGame()">Load Game</button>
        <input type="file" id="load-file-input" accept=".json" style="display: none;" onchange="main.methods.handleLoadFile(event)">
        <button id='controls-dial-btn' class="blue" onclick="main.methods.showControlsDial(event.clientX, event.clientY)">Menu</button>
      </div>

      <!-- Game Controls Dial -->
      <div id="controls-dial" class="controls-dial">
        <div class="controls-dial__backdrop"></div>
        <div class="controls-dial__ring">
          <div class="controls-dial__center" id="controls-dial-center">
            <svg class="controls-dial__center-icon" xmlns="http://www.w3.org/2000/svg" viewBox="0 0 640 640"><path d="M236.3 107.1C247.9 96 265 92.9 279.7 99.2C294.4 105.5 304 120 304 136L304 272.3L476.3 107.2C487.9 96 505 92.9 519.7 99.2C534.4 105.5 544 120 544 136L544 504C544 520 534.4 534.5 519.7 540.8C505 547.1 487.9 544 476.3 532.9L304 367.7L304 504C304 520 294.4 534.5 279.7 540.8C265 547.1 247.9 544 236.3 532.9L44.3 348.9C36.5 341.3 32 330.9 32 320C32 309.1 36.5 298.7 44.3 291.1L236.3 107.1z"/></svg>
          </div>
          <div class="controls-dial__quadrants">
            <div class="controls-dial__quadrant controls-dial__quadrant--top-left" data-action="restart">
              <div class="controls-dial__quadrant-inner">
                <span class="controls-dial__icon">↻</span>
              </div>
            </div>
            <div class="controls-dial__quadrant controls-dial__quadrant--top-right" data-action="draw">
              <div class="controls-dial__quadrant-inner">
                <span class="controls-dial__icon">½</span>
              </div>
            </div>
            <div class="controls-dial__quadrant controls-dial__quadrant--bottom-left" data-action="flip">
              <div class="controls-dial__quadrant-inner">
                <span class="controls-dial__icon">⇄</span>
              </div>
            </div>
            <div class="controls-dial__quadrant controls-dial__quadrant--bottom-right" data-action="resign">
              <div class="controls-dial__quadrant-inner">
                <span class="controls-dial__icon">✕</span>
              </div>
            </div>
          </div>
        </div>
      </div>
      <div id="game-mode-controls" style="margin-top: 15px; text-align: center;">
        <label style="font-family: 'Press Start 2P', cursive; font-size: 10px; color: #fff; text-shadow: 0 0 5px #fff; margin-right: 10px;">Mode:</label>
        <select id="game-mode" style="font-family: 'Press Start 2P', cursive; font-size: 10px; padding: 8px 12px; border: 3px solid #fff; background: #000; color: #fff; border-radius: 0; cursor: pointer;">
          <option value="pvp">Player vs Player</option>
          <option value="pvc">Player vs CPU (White)</option>
          <option value="cvp">CPU vs Player (Black)</option>
        </select>
        <div class="difficulty-slider-container" style="margin-top: 15px;">
          <label style="font-family: 'Press Start 2P', cursive; font-size: 10px; color: #fff; text-shadow: 0 0 5px #fff; display: block; margin-bottom: 10px;">Difficulty:</label>
          <div class="range-style" id="difficulty-slider-wrap">
            <input type="range" min="1" max="20" value="20" id="cpu-difficulty" aria-label="CPU Difficulty" oninput="main.methods.setCpuDifficulty(this.value)" />
            <div class="thumb-face" id="difficulty-thumb-face">
              <svg viewBox="0 0 40 40">
                <circle id="difficulty-face-circle" cx="20" cy="20" r="18" fill="#4CAF50" />
                <circle id="difficulty-eye-left" cx="14" cy="18" r="2" />
                <circle id="difficulty-eye-right" cx="26" cy="18" r="2" />
                <path id="difficulty-brow-left" d="M 8 9 L 15 9" />
                <path id="difficulty-brow-right" d="M 32 9 L 25 9" />
                <path id="difficulty-mouth-path" d="M 12 25 Q 20 31 28 25" />
              </svg>
            </div>
            <div class="hint" id="difficulty-hint">drag to adjust</div>
          </div>
          <span id="difficulty-label" style="font-family: 'Press Start 2P', cursive; font-size: 10px; color: #fff; text-shadow: 0 0 5px #fff; margin-left: 10px;">20</span>
        </div>
      </div>
    </div>
  </div>
  <div id="move-list-container">
    <div id="move-list-header">
      <h3>Move List</h3>
      <button id="clear-moves" class="gray" onclick="main.methods.clearMoveList()">Clear</button>
    </div>
    <div id="turn-display">It's White's Turn!</div>
    <div id="status-display"></div>
    <div id="move-list"></div>
  </div>
</div>
  <script src='https://cdnjs.cloudflare.com/ajax/libs/jquery/3.2.1/jquery.min.js'></script>
  <script  src="./script.js"></script>

</body>
</html>
